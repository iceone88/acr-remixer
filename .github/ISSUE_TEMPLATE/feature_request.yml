name: Idea / feature request
description: Something ACR Remixer could do better or should be able to do
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like, and what would you use it for?
      placeholder: |
        I'd like to set the stage length in pieces instead of metres, to practise short sections.
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else?
      description: Examples, screenshots, share codes, how other tools do it.
