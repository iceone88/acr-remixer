name: Build patched ACR Remixer for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python for the bundled backend
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip

      - name: Install backend dependencies and PyInstaller
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            oodle_shim
            gui

      - name: Build the open-source Oodle compatibility DLL
        run: cargo build --release --manifest-path oodle_shim/Cargo.toml

      - name: Freeze the Python backend into a Windows executable
        run: python -m PyInstaller packaging/backend.spec --distpath packaging/dist --workpath packaging/build --noconfirm

      - name: Smoke-test the frozen backend
        run: packaging/dist/stagegen-backend.exe --help

      - name: Build the Windows GUI executable
        run: cargo build --release --manifest-path gui/Cargo.toml

      - name: Upload acr-remixer.exe
        uses: actions/upload-artifact@v4
        with:
          name: acr-remixer-windows-exe
          path: gui/target/release/acr-remixer.exe
          if-no-files-found: error
          retention-days: 14
